<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sandbox-Zerstörer, kleine Spieldemo</title>
  <link rel="icon" href="/pwa-icon.png" type="image/png">
  <link rel="stylesheet" href="/assets/game.css">
  <link rel="stylesheet" href="/sb-styles.css">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }

    @media (max-width: 540px) {
      #tools-container {
        gap: 6px !important;
      }

      .ergonomic-menu {
        gap: 6px !important;
      }

      .mat-btn {
        height: 1.5rem !important;
        font-size: 5px !important;
      }
    }
  </style>
</head>

<body class="w-full h-full text-white font-pixel selection:bg-none cursor-crosshair">
  <canvas id="world" class="absolute inset-0 w-full h-full z-0" tabindex="0"
    aria-label="Kleine Spieldemo. Material links wählen und in die Welt malen."></canvas>

  <div class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none-wrapper p-2 sm:p-4">
    <div class="flex justify-between items-start w-full">
      <div></div>
      <div class="pointer-events-auto-child relative flex flex-col items-end gap-2">
        <button onclick="resetDemo()"
          class="bg-red-600 hover:bg-red-500 text-white text-[8px] py-2 px-3 border-b-2 border-red-800 active:border-b-0 active:translate-y-1 transition shadow-lg uppercase">LEEREN</button>
        <div
          class="bg-gray-900/80 p-1 border border-green-500/30 text-[6px] text-green-400 tracking-widest text-right w-full opacity-70">
          FPS:<span id="fps">60</span> ENT:<span id="entityCount">0</span>
        </div>
      </div>
    </div>

    <div class="flex-1 flex items-center">
      <div class="ergonomic-menu flex flex-col gap-2 sm:gap-3 -ml-2">
        <div id="tools-container" class="flex flex-col gap-2 sm:gap-3"></div>
      </div>
    </div>

    <div class="text-center pointer-events-none text-white/30 text-[8px] mb-1 uppercase">
      TOOL: <span id="currentMat" class="text-yellow-400">STEIN</span>
    </div>
  </div>

  <script src="/sb-chunk.js"></script>
  <script src="/sb-data.js"></script>
  <script src="/sb-utils.js"></script>
  <script src="/sb-world.js"></script>
  <script src="/sb-renderer.js"></script>
  <script src="/sb-physics.js"></script>
  <script src="/landing-page/demo.js"></script>
</body>

</html>
